name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'krueger/core/**'
      - 'krueger/trees/**'
      - 'krueger/compiler-api/**'
      - 'krueger/webapp-wasm/**'
      - 'sites/try-wasm/**'
      - 'project/**'
      - 'build.sbt'
      - 'sbt'
      - 'scripts/build/**'
      - '.github/actions/setup-sbt-caches/**'
      - 'VERSION'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            docs/package-lock.json
            sites/try-wasm/package-lock.json

      - name: Setup sbt caches
        uses: ./.github/actions/setup-sbt-caches

      - name: Build full site (Scaladoc, playground, Astro, try-wasm stitch)
        run: ./sbt --batch site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
