name: CI

on:
  push:
    branches: [main]
    tags-ignore:
      - "v*"
    paths-ignore:
      - ".github/CODEOWNERS"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".github/CODEOWNERS"

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup sbt caches
        uses: ./.github/actions/setup-sbt-caches

      - name: Check formatting
        run: ./sbt --batch scalafmtCheckAll scalafmtSbtCheck

      - name: Check build and workflow contracts
        run: node --test scripts/tests/site-staging.test.mjs scripts/tests/ci-results.test.mjs scripts/tests/publish.test.mjs scripts/tests/workflows.test.mjs scripts/tests/test-reports.test.mjs

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup sbt caches
        uses: ./.github/actions/setup-sbt-caches

      - name: Compile JVM modules
        run: ./sbt --batch coreJvm/compile

      - name: Run JVM tests
        run: ./sbt --batch testJvmFull

      - name: Stage webapp-wasm artifacts for itest
        run: ./sbt --batch stageWasm

      - name: Run BDD integration tests
        run: ./sbt --batch testIntegrationFull

      - name: Verify real test, empty-suite and formatting failures
        run: |
          node --test scripts/tests/sbt-failure.test.mjs
          node --test --test-name-pattern='qualification rejects' scripts/tests/sbt-build.test.mjs

  build-js:
    name: Build & Test (Scala.js)
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: docs/package-lock.json

      - name: Setup sbt caches
        uses: ./.github/actions/setup-sbt-caches

      - name: Compile JS modules
        run: ./sbt --batch coreJs/compile

      - name: Run all Scala.js tests
        run: ./sbt --batch testJsFull

      - name: Install docs npm dependencies
        run: npm ci
        working-directory: docs

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: docs

      - name: Run headless browser compiler facade parity check (JS-linked)
        run: |
          ./sbt --batch webappJs/fullLinkJS
          npm --prefix docs run test:webapp-wasm-browser -- -- target/out/linked/webapp-js

      - name: Run Wasm-linked compiler facade smoke
        run: |
          ./sbt --batch testWasmFull webappWasm/fullLinkJS
          npm --prefix docs run test:wasm-facade-smoke

  build-native:
    name: Build & Test (Scala Native)
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Scala Native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libunwind-dev libgc-dev

      - name: Setup sbt caches
        uses: ./.github/actions/setup-sbt-caches

      - name: Compile Native modules
        run: ./sbt --batch coreNative/compile

      - name: Run Native tests
        run: ./sbt --batch testNativeFull

  build-docs:
    name: Build Docs Site (Scaladoc + playground + Astro)
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            docs/package-lock.json
            sites/try-wasm/package-lock.json

      - name: Setup sbt caches
        uses: ./.github/actions/setup-sbt-caches

      - name: Build full site (Scaladoc, playground, Astro, try-wasm stitch)
        run: ./sbt --batch site

      - name: Verify full site outputs
        run: |
          set -euo pipefail
          missing=0
          for path in \
            docs/dist/index.html \
            docs/dist/api/index.html \
            docs/dist/api/jvm/index.html \
            docs/dist/api/js/index.html \
            docs/dist/api/native/index.html \
            docs/dist/try/index.html \
            sites/try-wasm/static/wasm/facade \
            sites/try-wasm/static/wasm/webgc; do
            if [ ! -e "$path" ]; then
              echo "MISSING: $path"
              missing=1
            fi
          done
          exit $missing

      - name: Verify linker prerequisites and Maven POM identities
        run: node --test --test-name-pattern='integration receives' scripts/tests/sbt-build.test.mjs

      - name: Upload docs/dist as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: docs/dist
          retention-days: 7
          if-no-files-found: error

  required:
    name: CI required
    if: ${{ always() }}
    needs: [lint, build, build-js, build-native, build-docs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require every selected category
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci/check-results.mjs lint build build-js build-native build-docs
